<!DOCTYPE HTML>
<html>
	<head>
		<title>Test for Versioning</title>
		<meta content="text/html; charset=UTF-8" http-equiv="content-type">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<!-- https://fonts.google.com/icons -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />		
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body onload="bodyLoaded()">
		<div id="Heading">
			<div>Test for Versioning</div>
			<div id="SubHeading">Index Page</div>
		</div>
		
		<h2 id="testText"></h2>
		<div id="testVersion"></div>



		<div class="update-container">
			<!-- Part1 BLOCK -->
			<div class="card part1-card" id="part1-card">
				<h2>Part1</h2>

				<div class="info">
					<p>Status: <span id="part1-status">Idle</span></p>
					<p>Aktuell: <span id="part1-current">-</span></p>
					<p>Neu: <span id="part1-available">-</span></p>
					<p>Update-Kanal: <span id="updateChannel">-</span></p>
				</div>

				<div class="actions">
					<button onclick="setChannel('stable')">Set Channel Stable</button>
					<button onclick="setChannel('dev')">Set Channel Dev</button>
					<button onclick="checkUpdate()">Check</button>
					<button onclick="startUpdatePart1()">Update Part1</button>
				</div>

				<progress id="part1-progress" max="100"></progress>
			</div>

			<!-- PART2 COLUMN -->
			<!--<div class="card part2-column" id="part2-list">-->
				<!-- Generated dynamically -->
			<!--</div>-->
		</div>

	</body>
	<script src="index.js"></script>
</html>
