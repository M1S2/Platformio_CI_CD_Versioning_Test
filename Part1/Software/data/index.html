<!DOCTYPE HTML>
<html>
	<head>
		<title>Test for Versioning</title>
		<meta content="text/html; charset=UTF-8" http-equiv="content-type">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<!-- https://fonts.google.com/icons -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />		
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body onload="bodyLoaded()">
		<div id="Heading">
			<div>Test for Versioning</div>
			<div id="SubHeading">Index Page</div>
		</div>
		
		<br>

		<div class="update-container">
			<!-- Common Status/Control Card -->
			<div class="card update-common-card">
				<h2>Update Übersicht</h2>

				<div>
					<p>Update-Kanal: <span id="update_channel">-</span></p>
					<p>Status: <span id="update_status">Idle</span></p>
					<progress id="update_progress" max="100"></progress>
				</div>

				<div class="sensor-data-buttons">
					<button onclick="setUpdateChannel('stable')">Set Channel Stable</button>
					<button onclick="setUpdateChannel('dev')">Set Channel Dev</button>
					<button class="icon-button" onclick="checkUpdate()" title="Check for new updates..."><i class="material-symbols-outlined">search</i></button>
				</div>
			</div>

			<!-- Components Container -->
			<div class="update-components-container" id="update-components-container">
				<!-- Components will be generated from template -->
			</div>
		</div>

		<!-- Component Column Template -->
		<template id="update-component-column-template">
			<div class="update-component-column">
				<h3 class="update-column-title"></h3>
				<div class="update-component-instance-card-container">
					<!-- Individual version cards will be added here -->
				</div>
			</div>
		</template>

		<!-- Component Instance Card Template -->
		<template id="update-component-instance-card-template">
			<div class="card update-component-instance-card">
				<div class="update-version-grid">
					<span class="update-version-label">Aktuell:</span> <span id="update-component-instance-current-version">-</span>
					<span class="update-version-label">Neu:</span> <span id="update-component-instance-available-version">-</span>
				</div>

				<div class="update-card-actions">
					<button type="button" id="btn-update-start" class="icon-button" title="Update component"><i class="material-symbols-outlined">upload</i></button>
				</div>
			</div>
		</template>

	</body>
	<script src="index.js"></script>
</html>
