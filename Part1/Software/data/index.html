<!DOCTYPE HTML>
<html>
	<head>
		<title>Test for Versioning</title>
		<meta content="text/html; charset=UTF-8" http-equiv="content-type">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<!-- https://fonts.google.com/icons -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />		
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body onload="bodyLoaded()">
		<div id="Heading">
			<div>Test for Versioning</div>
			<div id="SubHeading">Index Page</div>
		</div>
		
		<h2 id="testText"></h2>
		<div id="testVersion"></div>



		<div class="update-container">
			<!-- Common Status/Control Card -->
			<div class="card update-common-card">
				<h2>Allgemein</h2>

				<div>
					<p>Update-Kanal: <span id="update_channel">-</span></p>
					<p>Status: <span id="update_status">Idle</span></p>
					<progress id="update_progress" max="100"></progress>
				</div>

				<div>
					<button onclick="setUpdateChannel('stable')">Set Channel Stable</button>
					<button onclick="setUpdateChannel('dev')">Set Channel Dev</button>
					<button onclick="checkUpdate()" title="Check for new updates..."><i class="material-symbols-outlined">search</i></button>
				</div>
			</div>

			<!-- Two Columns -->
			<div class="update-columns-container">
				<!-- Part1 BLOCK -->
				<div class="card update-part1-card" id="part1-card">
					<h2>Part1</h2>

					<div>
						<p>Aktuell: <span id="part1-current-version">-</span></p>
						<p>Neu: <span id="part1-available-version">-</span></p>
					</div>

					<div>
						<form action="/update/start" method="get">
							<input type="hidden" name="part" value="part1">
							<button type="submit" title="Update Part1"><i class="material-symbols-outlined">upload</i></button>
						</form>
					</div>
				</div>

				<!-- Part2 BLOCK -->
				<div class="card update-part2-card" id="part2-card">
					<h2>Part2</h2>

					<div>
						<p>Aktuell: <span id="part2-current-version">-</span></p>
						<p>Neu: <span id="part2-available-version">-</span></p>
					</div>

					<div>
						<form action="/update/start" method="get">
							<input type="hidden" name="part" value="part2">
							<button type="submit" title="Update Part2"><i class="material-symbols-outlined">upload</i></button>
						</form>
					</div>
				</div>
			</div>
		</div>

	</body>
	<script src="index.js"></script>
</html>
