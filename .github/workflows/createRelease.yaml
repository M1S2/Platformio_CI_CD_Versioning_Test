name: Release Firmware

on:
  push:
    tags:
      - 'SW_v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#SW_v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Patch version into code
        run: |
          sed -i "s/@VERSION@/${{ steps.version.outputs.version }}/" Local/Software/include/version.h
          sed -i "s/@VERSION@/${{ steps.version.outputs.version }}/" Remote/Software/include/version.h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Local
        working-directory: Local/Software
        run: pio run

      - name: Build LittleFS image of Local
        working-directory: Local/Software
        run: pio run --target buildfs

      - name: Build Remote
        working-directory: Remote/Software
        run: pio run

      - name: Rename binaries
        run: |
          cp Local/Software/.pio/build/esp12e/firmware.bin local_fw_${{ steps.version.outputs.version }}.bin
          cp Local/Software/.pio/build/esp12e/littlefs.bin local_fs_${{ steps.version.outputs.version }}.bin
          cp Remote/Software/.pio/build/esp12e/firmware.bin remote_fw_${{ steps.version.outputs.version }}.bin

      - name: Generate MD5 checksums
        run: |
          LOCAL_FW_MD5=$(md5sum local_fw_${{ steps.version.outputs.version }}.bin | awk '{print $1}')
          LOCAL_FS_MD5=$(md5sum local_fs_${{ steps.version.outputs.version }}.bin | awk '{print $1}')
          REMOTE_FW_MD5=$(md5sum remote_fw_${{ steps.version.outputs.version }}.bin | awk '{print $1}')
          echo "LOCAL_FW_MD5=$LOCAL_FW_MD5" >> $GITHUB_ENV
          echo "LOCAL_FS_MD5=$LOCAL_FS_MD5" >> $GITHUB_ENV
          echo "REMOTE_FW_MD5=$REMOTE_FW_MD5" >> $GITHUB_ENV

      - name: Create manifest
        run: |
          cat <<EOF > manifest.json
          {
            "version": "${{ steps.version.outputs.version }}",
            "local_fw": "local_fw_${{ steps.version.outputs.version }}.bin",
            "local_fs": "local_fs_${{ steps.version.outputs.version }}.bin",
            "local_fw_md5": "${LOCAL_FW_MD5}",
            "local_fs_md5": "${LOCAL_FS_MD5}",
            "remote_fw": "remote_fw_${{ steps.version.outputs.version }}.bin",
            "remote_fw_md5": "${REMOTE_FW_MD5}"
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Firmware ${{ steps.version.outputs.version }}"
          files: |
            manifest.json
            local_fw_${{ steps.version.outputs.version }}.bin
            local_fs_${{ steps.version.outputs.version }}.bin
            remote_fw_${{ steps.version.outputs.version }}.bin