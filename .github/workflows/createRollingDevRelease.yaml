name: Dev Firmware

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version will be e.g. "dev-SW_v1.2.0-p5-a1b2c3" or "dev-none-p0-a1b2c3"
      - name: Generate dev version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

          if [ "$LAST_TAG" = "none" ]; then
            DISTANCE="0"
          else
            DISTANCE=$(git rev-list ${LAST_TAG}..HEAD --count)
          fi

          echo "version=dev-${LAST_TAG}-p${DISTANCE}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Patch version into code
        run: |
          sed -i "s/@VERSION@/${{ steps.version.outputs.version }}/" Local/Software/include/version.h
          sed -i "s/@VERSION@/${{ steps.version.outputs.version }}/" Remote/Software/include/version.h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Local
        working-directory: Local/Software
        run: pio run

      - name: Build LittleFS image of Local
        working-directory: Local/Software
        run: pio run --target buildfs

      - name: Build Remote
        working-directory: Remote/Software
        run: pio run

      - name: Prepare files
        run: |
          mkdir -p dist/firmware/dev

          cp Local/Software/.pio/build/esp12e/firmware.bin dist/firmware/dev/local_fw.bin
          cp Local/Software/.pio/build/esp12e/littlefs.bin dist/firmware/dev/local_fs.bin
          cp Remote/Software/.pio/build/esp12e/firmware.bin dist/firmware/dev/remote_fw.bin

      - name: Generate MD5 checksums
        run: |
          LOCAL_FW_MD5=$(md5sum dist/firmware/dev/local_fw.bin | awk '{print $1}')
          LOCAL_FS_MD5=$(md5sum dist/firmware/dev/local_fs.bin | awk '{print $1}')
          REMOTE_FW_MD5=$(md5sum dist/firmware/dev/remote_fw.bin | awk '{print $1}')
          echo "LOCAL_FW_MD5=$LOCAL_FW_MD5" >> $GITHUB_ENV
          echo "LOCAL_FS_MD5=$LOCAL_FS_MD5" >> $GITHUB_ENV
          echo "REMOTE_FW_MD5=$REMOTE_FW_MD5" >> $GITHUB_ENV

      - name: Create manifest
        run: |
          cat <<EOF > dist/firmware/dev/manifest.json
          {
            "version": "${{ steps.version.outputs.version }}",
            "local_fw": "local_fw.bin",
            "local_fs": "local_fs.bin",
            "local_fw_md5": "${LOCAL_FW_MD5}",
            "local_fs_md5": "${LOCAL_FS_MD5}",
            "remote_fw": "remote_fw.bin",
            "remote_fw_md5": "${REMOTE_FW_MD5}"
          }
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_empty_commit: false
          force_orphan: true
          publish_dir: ./dist
          publish_branch: gh-pages